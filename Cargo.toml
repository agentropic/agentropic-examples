[package]
name = "examples"
version = "0.1.0"
edition = "2021"
authors = ["rustyai <devrustyai@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Example applications demonstrating the rustyai multi-agent framework"
repository = "https://github.com/RustyAI/examples"
keywords = ["agents", "multi-agent", "examples", "autonomous"]
publish = false

[dependencies]
agent-core = { path = "../agent-core" }
messaging = { path = "../messaging" }
cognition = { path = "../cognition" }
patterns = { path = "../patterns" }
runtime = { path = "../runtime" }
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }

[[example]]
name = "hello_agent"
path = "examples/hello_agent.rs"

[[example]]
name = "messaging"
path = "examples/messaging.rs"

[[example]]
name = "agents_talking"
path = "examples/agents_talking.rs"

[[example]]
name = "supervised_agents"
path = "examples/supervised_agents.rs"

[[example]]
name = "cognitive_agent"
path = "examples/cognitive_agent.rs"

[[example]]
name = "full_system"
path = "examples/full_system.rs"

[[example]]
name = "team_pattern"
path = "examples/team_pattern.rs"

[[example]]
name = "hierarchy_pattern"
path = "examples/hierarchy_pattern.rs"

[[example]]
name = "swarm_pattern"
path = "examples/swarm_pattern.rs"

[[example]]
name = "coalition_pattern"
path = "examples/coalition_pattern.rs"

[[example]]
name = "market_pattern"
path = "examples/market_pattern.rs"

